<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PDF Data Extraction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #74ebd5 0%, #acb6e5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        .btn-primary {
            background-color: #4a69bd;
            border: none;
        }
        .btn-primary:hover {
            background-color: #1e3799;
        }
    </style>
</head>
<body>

<div class="card p-4">
    <h2 class="text-center mb-4">Upload PDF for Extraction</h2>
    <form method="POST" action="/extract" enctype="multipart/form-data">
        <div class="mb-3">
        <label for="pdf" class="form-label">Select PDF Document</label>
        <input type="file" class="form-control" id="pdf" name="pdf_file" required>
        </div>
        <div class="mb-3">
        <label for="fields" class="form-label">Fields to Extract</label>
        <input type="text" class="form-control" id="fields" name="fields" placeholder="e.g., Name of Work, Estimate Amount" required>
        <div class="form-text">Enter fields separated by commas.</div>
        </div>
        <div class="d-grid">
        <button type="submit" class="btn btn-primary">Extract Information</button>
        </div>
        </form>
         
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
